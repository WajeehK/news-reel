name: Fetch news & deploy
on:
  schedule: [{cron: '4,19,34,49 * * * *'}]
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
jobs:
  build:
    concurrency: {group: pages, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: {name: github-pages, url: '${{ steps.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - name: Restore rolling archive from live site
        run: mkdir -p data && (curl -sfL --max-time 20 "https://wajeehk.github.io/news-reel/data/archive.json?t=$(date +%s)" -o data/archive.json || rm -f data/archive.json)
      - name: Fetch & build feed
        run: python3 scripts/fetch_news.py
      - name: Keep schedule alive (GitHub disables crons after 60 idle days)
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( now - last )) -gt 3888000 ]; then
            date -u > .keepalive && git config user.name news-reel-bot && git config user.email actions@users.noreply.github.com
            git add .keepalive && git commit -m "keepalive [skip ci]" && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deploy
        uses: actions/deploy-pages@v4
  # Self-scheduling chain: ~14 min after each run, dispatch the next one (GitHub's cron is often late/skipped).
  # Only the newest run keeps the chain going, so parallel triggers (cron, box watchdog, pushes) converge to one chain.
  chain:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {actions: write}
    steps:
      - run: sleep 780
      - name: Dispatch next refresh unless a newer run exists
        env: {GH_TOKEN: '${{ github.token }}', R: '${{ github.repository }}', ID: '${{ github.run_id }}'}
        run: |
          me=$(gh api repos/$R/actions/runs/$ID -q .created_at)
          newer=$(gh api "repos/$R/actions/workflows/news.yml/runs?per_page=10" -q "[.workflow_runs[]|select(.id!=$ID and .created_at>\"$me\")]|length")
          if [ "$newer" = "0" ]; then gh workflow run news.yml -R $R --ref main && echo dispatched; else echo "newer run exists ($newer), chain continues there"; fi
