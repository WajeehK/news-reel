<!doctype html>
<html lang="en" style="background:#000"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="News Reel">
<meta name="description" content="Latest news with cinematic intros">
<title>News Reel</title>
<style>html,body{background:#000;margin:0}#boot{position:fixed;inset:0;z-index:300;background:#000;display:grid;place-items:center;transition:opacity .45s}#boot.hide{opacity:0;pointer-events:none}
#boot .w{font:900 30px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.03em;color:#fff;display:flex;align-items:center;gap:12px;animation:bw 1s cubic-bezier(.2,.9,.2,1) both}
#boot .w i{width:14px;height:14px;border-radius:50%;background:#ff3b30;box-shadow:0 0 18px #ff3b30;animation:bb 1s infinite}
#boot .w span{color:#ff3b30}@keyframes bw{from{opacity:0;letter-spacing:.3em;filter:blur(8px)}}@keyframes bb{50%{opacity:.3}}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=1"><link rel="stylesheet" href="intros.css?v=1">
</head><body>
<div id="boot"><div class="w"><i></i>NEWS<span>REEL</span></div></div>
<header class="top">
  <div class="brand"><i class="dot"></i><b>News</b><b class="r">Reel</b><span class="upd" id="upd"></span></div>
  <div class="brk" id="brk" hidden><span class="bl">BREAKING</span><div class="bt"><div class="btrack" id="btrack"></div></div></div>
</header>
<main class="wrap" id="main">
  <section data-view="feed">
    <div class="chips" id="chips"></div>
    <div id="feed"></div>
  </section>
  <section data-view="recap" hidden>
    <div class="h1">Today in 5</div><p class="sub" id="recapsub"></p>
    <button class="play press" id="playall">▶ Play the recap</button>
    <div id="recap"></div>
  </section>
  <section data-view="saved" hidden><div class="h1">Saved</div><div id="saved"></div></section>
  <section data-view="alerts" hidden>
    <div class="h1">Alerts</div>
    <p class="sub">Follow names or topics. Matching stories get a bell and jump up your feed.</p>
    <form id="kwform" class="kwf"><input id="kwin" placeholder="e.g. Hegseth, Bitcoin, Arsenal" autocomplete="off"><button class="press">Add</button></form>
    <div class="kws" id="kws"></div>
    <button class="notif press" id="notif">Enable notifications</button>
    <p class="fine" id="notifnote"></p>
    <div class="lbl">Matching now</div><div id="matches"></div>
  </section>
  <div class="foot" id="foot"></div>
</main>
<nav class="dock" id="dock" aria-label="Tabs"><span class="bubble" id="bubble"></span>
  <button class="tb on" data-tab="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>For You</button>
  <button class="tb" data-tab="recap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/></svg>Recap</button>
  <button class="tb" data-tab="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Saved</button>
  <button class="tb" data-tab="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg>Alerts</button>
</nav>
<script src="intros.js?v=1"></script><script src="app.js?v=1"></script>
</body></html>
